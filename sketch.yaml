profiles:
  ESP32-S3-DevKitC-1:
    fqbn: esp32:esp32:esp32:UploadSpeed=921600,CPUFreq=240,FlashFreq=80,FlashMode=qio,FlashSize=4M,PartitionScheme=default,DebugLevel=none,PSRAM=disabled,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default,ZigbeeMode=default
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - Adafruit SSD1306 (2.5.17)
      - Adafruit GFX Library (1.13.0)
      - Adafruit BusIO (1.17.4)
      - ESP32RotaryEncoder (1.2.0)
    port: COM7
    port_config:
      baudrate: "115200"
      bits: "8"
      parity: none
      stop_bits: one
  ESP32-WROOM-32:
    fqbn: esp32:esp32:esp32:UploadSpeed=921600,CPUFreq=240,FlashFreq=80,FlashMode=qio,FlashSize=4M,PartitionScheme=default,DebugLevel=none,PSRAM=disabled,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default,ZigbeeMode=default
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - Adafruit GFX Library (1.13.0)
      - Adafruit BusIO (1.17.4)
      - Adafruit SSD1306 (2.5.17)
      - ESP32RotaryEncoder (1.2.0)
    port: COM7
    port_config:
      baudrate: "115200"
      lineEnding: "\r\n"
      bits: "8"
      parity: none
      stop_bits: one
default_profile: ESP32-S3-DevKitC-1
